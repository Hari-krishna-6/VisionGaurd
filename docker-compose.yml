services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      VISIONGUARD_DATASET_ROOT: /data/visa_prepared/1cls
      VISIONGUARD_CATEGORY: candle
      VISIONGUARD_MODEL_PATH: /app/artifacts/model.npz
      VISIONGUARD_HEATMAP_DIR: /app/artifacts/heatmaps
      VISIONGUARD_DEVICE: cpu
    volumes:
      - ./data/visa_prepared/1cls:/data/visa_prepared/1cls:ro
      - ./artifacts/model.npz:/app/artifacts/model.npz:ro
      - ./artifacts/heatmaps:/app/artifacts/heatmaps
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 20s
